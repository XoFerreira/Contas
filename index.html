<!DOCTYPE html>
<html lang="pt-PT"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contas da Família</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--tx:#1b1f24;--mut:#6b7280;--ac:#2563eb;--bad:#dc2626;--warn:#d97706;--ok:#16a34a;--bd:#e5e7eb;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--card:#1b2027;--tx:#eef0f3;--mut:#9aa3af;--ac:#60a5fa;--bd:#2b323b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111418;--card:#1b2027;--tx:#eef0f3;--mut:#9aa3af;--ac:#60a5fa;--bd:#2b323b;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:90px}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 12px}h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:20px 0 8px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.box,.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}
.box b{display:block;font-size:20px}.box span{color:var(--mut);font-size:13px}
.alert{border-radius:14px;padding:12px;margin:12px 0;background:color-mix(in srgb,var(--bad) 14%,var(--card));border:1px solid var(--bad)}
.alert.w{background:color-mix(in srgb,var(--warn) 14%,var(--card));border-color:var(--warn)}
.alert div{margin-top:4px}
.card{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.info{flex:1;min-width:0;cursor:pointer}.info strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{color:var(--mut);font-size:13px}.amt{font-weight:600;text-align:right}
.tag{font-size:12px;font-weight:600}.bad{color:var(--bad)}.warn{color:var(--warn)}.ok{color:var(--ok)}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--ac);color:#fff;cursor:pointer}
button.g{background:transparent;color:var(--ac);border:1px solid var(--bd)}button.d{background:var(--bad)}
.pay{padding:8px 10px;font-size:14px;margin-top:6px;display:block;margin-left:auto}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));font-size:16px;padding:14px 20px;border-radius:30px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:5}
.ov.on{display:flex}.sheet{background:var(--card);width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
.row{display:flex;gap:8px;margin-top:16px}.row button{flex:1}
.chips{display:flex;gap:6px;overflow-x:auto;margin:10px 0 0;padding-bottom:4px}.chip{white-space:nowrap;background:var(--card);color:var(--tx);border:1px solid var(--bd);padding:6px 12px;font-size:14px;border-radius:20px}.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.fb{position:relative;display:inline-block;padding:10px 14px;border:1px solid var(--bd);border-radius:10px;color:var(--ac);margin:6px 6px 0 0;overflow:hidden}.fb input{position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;font-size:0;cursor:pointer}
.msg{text-align:center;color:var(--mut);padding:30px 10px}
</style></head><body>
<main>
<h1>💶 Contas da Família</h1>
<div id="app"><div class="msg">A carregar…</div></div>
</main>
<button class="fab" id="add" style="display:none">+ Novo pagamento</button>
<div class="ov" id="ov"><div class="sheet">
<h1 id="ft">Novo pagamento</h1>
<label>Nome</label><input id="fn" placeholder="Ex.: Seguro do carro">
<label>Categoria</label><select id="fc"><option>Seguros</option><option>Casa</option><option>Escola</option><option>Carros</option><option>Saúde</option><option>Serviços</option><option selected>Outros</option></select>
<label>Para quem</label><select id="fp"></select>
<div class="row" id="np" style="display:none;margin-top:8px"><input id="fnp" placeholder="Nome da pessoa"><button id="nb" style="flex:none">Adicionar</button></div>
<label>Valor (€)</label><input id="fa" type="number" inputmode="decimal" step="0.01" min="0">
<label>Frequência</label><select id="ff"><option value="weekly">Semanal</option><option value="monthly" selected>Mensal</option><option value="yearly">Anual</option><option value="once">Único</option></select>
<label>Próxima data de pagamento</label><input id="fd" type="date">
<label>Avisar com antecedência de</label><select id="fw"><option value="1">1 dia</option><option value="2">2 dias</option><option value="3">3 dias</option><option value="7" selected>7 dias</option><option value="14">14 dias</option><option value="30">30 dias</option></select>
<div id="fatt" style="display:none"><label>Anexos (fatura, contrato…)</label><div id="fal"></div><label class="fb">📷 Tirar foto<input id="fac" type="file" accept="image/*" capture="environment"></label><label class="fb">📎 Escolher ficheiro<input id="faf" type="file" multiple></label>
<div class="row" style="margin-top:6px"><input id="fll" placeholder="Ou cole uma ligação (Drive, iCloud…)"><button id="flb" style="flex:none">Adicionar</button></div></div>
<div class="row"><button class="g" id="cx">Cancelar</button><button id="sv">Guardar</button></div>
<div class="row" id="delrow" style="display:none"><button class="d" id="dl">Eliminar</button></div>
</div></div>
<div class="ov" id="pv"><div class="sheet"><h1 id="pt">Marcar como pago</h1><label>Forma de pagamento</label><select id="pm"><option>Multibanco</option><option>MB WAY</option><option>Numerário</option><option>Transferência bancária</option><option>Débito direto</option><option>Cartão</option><option>Outro</option></select><label>Nota (opcional)</label><textarea id="pn" rows="3" placeholder="Ex.: pago com atraso, referência, observações…"></textarea><div id="patt" style="display:none"><label>Anexar comprovativo ou fatura</label><div id="pal"></div><label class="fb">📷 Tirar foto<input id="pac" type="file" accept="image/*" capture="environment"></label><label class="fb">📎 Escolher ficheiro<input id="paf" type="file" multiple></label>
<div class="row" style="margin-top:6px"><input id="pll" placeholder="Ou cole uma ligação (Drive, iCloud…)"><button id="plb" style="flex:none">Adicionar</button></div></div>
<div class="row"><button class="g" id="pc">Cancelar</button><button id="po">Confirmar pagamento</button></div></div></div>
<div class="ov" id="cv" style="z-index:9"><div class="sheet"><p id="cm"></p><div class="row"><button class="g" id="cn">Cancelar</button><button id="cy">OK</button></div></div></div>
<div id="login" style="position:fixed;inset:0;z-index:20;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center"><div style="font-size:48px">💶</div><h1>Contas da Família</h1><button id="lg">Entrar com Google</button><div class="sub" id="lm"></div></div>
<script>
window.addEventListener("error",function(e){var L=document.getElementById("login"),M=document.getElementById("lm");if(L){L.style.display="flex";M.textContent="Erro: "+(e.message||"não foi possível carregar o Firebase")}},true);
window.claude={use:function(n){return new Promise(function(r){(function w(){if(window.__fbUse)r(window.__fbUse(n));else setTimeout(w,100)})()})}};
</script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithPopup,signInWithRedirect,GoogleAuthProvider} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {initializeFirestore,persistentLocalCache,collection,doc,onSnapshot,addDoc,updateDoc,setDoc,deleteDoc,getDoc} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
/* ===== COLE AQUI A CONFIGURAÇÃO DO SEU PROJETO FIREBASE ===== */
const cfg={apiKey:"AIzaSyBBs2pK94-brwfjFwypE87yvK8HlBRlPB0",authDomain:"contas-familia-a2add.firebaseapp.com",projectId:"contas-familia-a2add",appId:"1:1085801598921:web:b716961162f3497c45a218"};
/* ============================================================ */
const app=initializeApp(cfg),auth=getAuth(app),fs=initializeFirestore(app,{localCache:persistentLocalCache()});
const L=document.getElementById("login"),M=document.getElementById("lm");
document.getElementById("lg").onclick=async()=>{const p=new GoogleAuthProvider();try{await signInWithPopup(auth,p)}catch(e){if(e.code!=="auth/popup-closed-by-user"){try{await signInWithRedirect(auth,p)}catch(x){M.textContent="Erro: "+x.code}}}};
const snapD=s=>({docs:s.docs.map(d=>({id:d.id,data:()=>d.data()}))});
function mk(user){
  const col=n=>{const c=collection(fs,n);return {onSnapshot:(cb,er)=>onSnapshot(c,s=>cb(snapD(s)),er),add:d=>addDoc(c,d),doc:i=>{const r=doc(fs,n,i);return {update:d=>updateDoc(r,d),set:d=>setDoc(r,d),delete:()=>deleteDoc(r)}}}};
  return n=>{
    if(n==="db")return {collection:col,doc:p=>{const r=doc(fs,...p.split("/"));return {onSnapshot:(cb,er)=>onSnapshot(r,s=>cb({data:()=>s.data()}),er),set:d=>setDoc(r,d)}}};
    if(n==="user")return {id:async()=>user.uid,profiles:async ids=>{const o={};await Promise.all(ids.map(async i=>{try{const s=await getDoc(doc(fs,"users",i));o[i]={name:(s.data()||{}).name||""}}catch(e){}}));return o}};
    if(n==="downloads")return {save:async({filename,data})=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"text/calendar"}));a.download=filename;document.body.appendChild(a);a.click();a.remove()}};
    return null}}
onAuthStateChanged(auth,async u=>{
  if(!u){L.style.display="flex";return}
  L.style.display="none";
  try{await setDoc(doc(fs,"users",u.uid),{name:u.displayName||u.email})}catch(e){}
  window.__fbUse=mk(u)});
</script>
<script>
var $=function(s){return document.querySelector(s)};
var items=[],hist=[],members=[],pF="all",sdoc=null,hcol=null,view="next",catF="all",CATS=["Seguros","Casa","Escola","Carros","Saúde","Serviços","Outros"],col=null,myId=null,names={},editId=null,userCap=null,loaded=false;
var FQ={weekly:"semanal",monthly:"mensal",yearly:"anual",once:"único"};
var eur=new Intl.NumberFormat("pt-PT",{style:"currency",currency:"EUR"});
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function pd(s){var p=s.split("-").map(Number);return new Date(p[0],p[1]-1,p[2])}
function fd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function today(){var d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function nxt(s,f){var d=pd(s);if(f==="weekly")d.setDate(d.getDate()+7);else{var day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+(f==="monthly"?1:12));d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()))}return fd(d)}
function days(s){return Math.round((pd(s)-today())/864e5)}
function when(n){return n<0?"Atrasado "+(-n)+(n===-1?" dia":" dias"):n===0?"Hoje":n===1?"Amanhã":"Em "+n+" dias"}
function cls(it){var n=days(it.due);return n<0?"bad":n<=(it.warn||7)?"warn":""}
function fmtDate(s){return pd(s).toLocaleDateString("pt-PT",{day:"numeric",month:"short",year:"numeric"})}
function exportIcs(){
  var all=items.filter(function(i){return !i.done});
  if(!all.length){dlg("Não há pagamentos para exportar.");return}
  var BS=String.fromCharCode(92),NL=String.fromCharCode(13,10);
  var esc2=function(s){return String(s).split(";").join(BS+";").split(",").join(BS+",")};
  var dt=function(s){return s.split("-").join("")};
  var stamp=new Date().toISOString().split("-").join("").split(":").join("").slice(0,15)+"Z";
  var L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Contas da Familia//PT","CALSCALE:GREGORIAN"];
  all.forEach(function(i){
    var d=pd(i.due),e=fd(new Date(d.getFullYear(),d.getMonth(),d.getDate()+1)),w=i.warn||7;
    L.push("BEGIN:VEVENT","UID:"+i.id+"@contas-familia","DTSTAMP:"+stamp,"DTSTART;VALUE=DATE:"+dt(i.due),"DTEND;VALUE=DATE:"+dt(e),"SUMMARY:"+esc2("💶 "+i.name+" ("+eur.format(i.amount||0)+")"));
    var r={weekly:"WEEKLY",monthly:"MONTHLY",yearly:"YEARLY"}[i.freq];if(r)L.push("RRULE:FREQ="+r);
    L.push("DESCRIPTION:"+esc2((i.cat||"")+(i.who&&i.who!=="Geral"?" - "+i.who:"")),
      "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+esc2(i.name),"TRIGGER:-P"+(w-1)+"DT15H","END:VALARM",
      "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+esc2(i.name),"TRIGGER:PT9H","END:VALARM","END:VEVENT")});
  L.push("END:VCALENDAR");
  claude.use("downloads").then(function(dl){if(!dl){dlg("A exportação não está disponível neste dispositivo.");return}return dl.save({filename:"contas-familia.ics",data:L.join(NL)+NL})}).catch(function(e){dlg(e&&e.code==="declined"?"Exportação cancelada.":"Não foi possível exportar o calendário ("+(e&&e.code||"erro")+").")})
}
function dlg(t,cb){$("#cm").textContent=t;$("#cn").style.display=cb?"":"none";$("#cv").classList.add("on");$("#cy").onclick=function(){$("#cv").classList.remove("on");if(cb)cb()};$("#cn").onclick=function(){$("#cv").classList.remove("on")}}
function nav(){return'<div class="chips">'+[["next","Próximos"],["hist","Histórico"]].map(function(v){return'<button class="chip'+(view===v[0]?' on':'')+'" data-view="'+v[0]+'">'+v[1]+'</button>'}).join("")+'</div><div class="chips">'+["all"].concat(CATS).map(function(c){return'<button class="chip'+(catF===c?' on':'')+'" data-cat="'+c+'">'+(c==="all"?"Todas":c)+'</button>'}).join("")+'</div><div class="chips">'+["all","Geral"].concat(members).map(function(w){return'<button class="chip'+(pF===w?' on':'')+'" data-who="'+esc(w)+'">'+(w==="all"?"Todos":w==="Geral"?"👥 Geral":"👤 "+esc(w))+'</button>'}).join("")+'</div>'}
function match(i){return (catF==="all"||(i.cat||"Outros")===catF)&&(pF==="all"||(i.who||"Geral")===pF)}
function fillP(v){var s=$("#fp"),l=["Geral"].concat(members);if(v&&l.indexOf(v)<0)l.push(v);s.innerHTML=l.map(function(m){return'<option>'+esc(m)+'</option>'}).join("")+'<option value="__new">➕ Adicionar pessoa…</option>';s.value=v||"Geral";$("#np").style.display="none"}
function resolve(ids){if(ids.length&&userCap&&userCap.profiles)userCap.profiles(ids).then(function(p){var ch=false;ids.forEach(function(id){if(p&&p[id]&&p[id].name){names[id]=p[id].name;ch=true}});if(ch)render()}).catch(function(){})}
function renderHist(){
  var l=hist.filter(match).sort(function(a,b){return a.date<b.date?1:-1});
  var h=nav(),cur="",tot={},ids=[];
  if(!l.length)h+='<div class="msg">Ainda não há pagamentos registados.<br>Quando tocar em “✓ Pago”, ficam aqui.</div>';
  l.forEach(function(x){var m=x.date.slice(0,7);tot[m]=(tot[m]||0)+(x.amount||0);if(x.by&&!names[x.by]&&ids.indexOf(x.by)<0)ids.push(x.by)});
  l.forEach(function(x){var m=x.date.slice(0,7);
    if(m!==cur){cur=m;h+='<h2>'+pd(m+"-01").toLocaleDateString("pt-PT",{month:"long",year:"numeric"})+' · '+eur.format(tot[m])+'</h2>'}
    var by=x.by&&names[x.by]?" · pago por "+esc(names[x.by]):"";
    h+='<div class="card"><div class="info"><strong>'+esc(x.name)+'</strong><span class="sub">'+(x.who&&x.who!=="Geral"?'👤 '+esc(x.who)+' · ':'')+(x.cat?esc(x.cat)+' · ':'')+fmtDate(x.date)+by+(x.method?' · '+esc(x.method):'')+'</span>'+(x.note?'<span class="sub" style="display:block">📝 '+esc(x.note)+'</span>':'')+(x.att&&x.att.length?'<span class="sub" style="display:block">'+x.att.map(function(a){return'<a href="'+esc(a.url||"/_blob/"+a.id)+'" target="_blank" rel="noopener">📎 '+esc(a.name)+'</a>'}).join(" · ")+'</span>':'')+'</div><div class="amt">'+eur.format(x.amount||0)+'</div></div>'});
  $("#app").innerHTML=h;resolve(ids)
}
function render(){
  if(!col)return;
  if(view==="hist"){renderHist();return}
  var all=items.filter(function(i){return !i.done}).sort(function(a,b){return a.due<b.due?-1:1}),list=all.filter(match);
  var annual=0;list.forEach(function(i){var m={weekly:52,monthly:12,yearly:1,once:0}[i.freq]||0;annual+=(i.amount||0)*m});
  var h=nav()+'<div class="sum"><div class="box"><b>'+eur.format(annual/12)+'</b><span>Média por mês</span></div><div class="box"><b>'+eur.format(annual)+'</b><span>Total por ano</span></div></div><button class="g" data-ics="1" style="width:100%;margin-top:10px">📅 Exportar para o calendário</button>';
  var al=all.filter(function(i){return days(i.due)<=(i.warn||7)});
  if(al.length){var late=al.some(function(i){return days(i.due)<0});
    h+='<div class="alert'+(late?'':' w')+'"><strong>'+(late?"⚠️ Atenção: há pagamentos em atraso":"🔔 A aproximar-se")+'</strong>'+al.map(function(i){return'<div>'+esc(i.name)+(i.who&&i.who!=="Geral"?' ('+esc(i.who)+')':'')+' · '+eur.format(i.amount||0)+' · <b>'+when(days(i.due))+'</b></div>'}).join("")+'</div>'}
  if(!loaded&&!list.length)h+='<div class="msg">A sincronizar…</div>';
  else if(!list.length)h+='<div class="msg">Ainda não há pagamentos.<br>Toque em “Novo pagamento” para começar.</div>';
  var groups=[["Em atraso",function(n){return n<0}],["Próximos 7 dias",function(n){return n>=0&&n<=7}],["Próximos 30 dias",function(n){return n>7&&n<=30}],["Mais tarde",function(n){return n>30}]];
  groups.forEach(function(g){
    var gi=list.filter(function(i){return g[1](days(i.due))});if(!gi.length)return;
    h+='<h2>'+g[0]+'</h2>'+gi.map(function(i){
      var by=i.paidBy&&names[i.paidBy]?" · pago por "+esc(names[i.paidBy])+" em "+fmtDate(i.lastPaid):"";
      return'<div class="card"><div class="info" data-edit="'+i.id+'"><strong>'+esc(i.name)+'</strong><span class="sub">'+(i.who&&i.who!=="Geral"?'👤 '+esc(i.who)+' · ':'')+(i.cat?esc(i.cat)+' · ':'')+fmtDate(i.due)+' · '+FQ[i.freq]+by+(i.att&&i.att.length?' · 📎 '+i.att.length:'')+'</span></div><div><div class="amt">'+eur.format(i.amount||0)+'</div><div class="tag '+cls(i)+'">'+when(days(i.due))+'</div><button class="pay" data-pay="'+i.id+'">✓ Pago</button></div></div>'}).join("")});
  $("#app").innerHTML=h;
  var ids=[];items.forEach(function(i){if(i.paidBy&&!names[i.paidBy]&&ids.indexOf(i.paidBy)<0)ids.push(i.paidBy)});
  if(ids.length&&userCap&&userCap.profiles)userCap.profiles(ids).then(function(p){var ch=false;ids.forEach(function(id){if(p&&p[id]&&p[id].name){names[id]=p[id].name;ch=true}});if(ch)render()}).catch(function(){})
}
function openForm(id){
  editId=id;var it=items.find(function(i){return i.id===id})||{};
  $("#ft").textContent=id?"Editar pagamento":"Novo pagamento";
  $("#fn").value=it.name||"";$("#fc").value=it.cat||"Outros";fillP(it.who||"Geral");$("#fa").value=it.amount!=null?it.amount:"";$("#ff").value=it.freq||"monthly";$("#fd").value=it.due||fd(today());$("#fw").value=String(it.warn||7);
  fAtt=(it.att||[]).slice();showAtt();$("#delrow").style.display=id?"flex":"none";$("#ov").classList.add("on")
}
function closeForm(){$("#ov").classList.remove("on")}
$("#add").onclick=function(){openForm(null)};$("#cx").onclick=closeForm;
$("#fp").onchange=function(){if(this.value==="__new"){$("#np").style.display="flex";$("#fnp").focus()}else $("#np").style.display="none"};
$("#nb").onclick=function(){var n=$("#fnp").value.trim();if(n&&n!=="Geral"&&members.indexOf(n)<0){members=members.concat([n]);if(sdoc)sdoc.set({members:members}).catch(function(){dlg("Não foi possível guardar a pessoa.")})}$("#fnp").value="";fillP(n&&n!=="Geral"?n:"Geral")};
$("#sv").onclick=function(){
  var name=$("#fn").value.trim(),amt=parseFloat($("#fa").value),due=$("#fd").value;
  if(!name||isNaN(amt)||!due){dlg("Preencha o nome, o valor e a data.");return}
  var data={att:fAtt.slice(),name:name,cat:$("#fc").value,who:$("#fp").value==="__new"?"Geral":$("#fp").value,amount:amt,freq:$("#ff").value,due:due,warn:parseInt($("#fw").value,10)};
  var p=editId?col.doc(editId).update(data):col.add(data);
  p.then(closeForm).catch(function(){dlg("Não foi possível guardar. Confirme que tem permissão de edição.")})
};
$("#dl").onclick=function(){dlg("Eliminar este pagamento?",function(){col.doc(editId).delete().then(closeForm).catch(function(){dlg("Sem permissão para eliminar.")})})};
$("#ov").onclick=function(e){if(e.target.id==="ov")closeForm()};
$("#app").onclick=function(e){
  var t=e.target.closest("[data-pay],[data-edit],[data-view],[data-cat],[data-who],[data-ics]");if(!t)return;if(t.dataset.view){view=t.dataset.view;render();return}if(t.dataset.cat){catF=t.dataset.cat;render();return}if(t.dataset.who){pF=t.dataset.who;render();return}if(t.dataset.ics){exportIcs();return}
  if(t.dataset.edit){openForm(t.dataset.edit);return}
  var it=items.find(function(i){return i.id===t.dataset.pay});if(!it)return;
  openPay(it)};
var payIt=null,assets=null,fAtt=[],pAtt=[];
function attHtml(a){return a.map(function(x,n){return'<div class="sub" style="display:flex;gap:8px;align-items:center;margin:4px 0"><a href="'+esc(x.url||"/_blob/"+x.id)+'" target="_blank" rel="noopener" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">📎 '+esc(x.name)+'</a><button class="g" style="padding:4px 10px" data-rm="'+n+'">✕</button></div>'}).join("")}
function showAtt(){$("#fal").innerHTML=attHtml(fAtt);$("#pal").innerHTML=attHtml(pAtt)}
$("#fal").onclick=function(e){var b=e.target.closest("[data-rm]");if(b){fAtt.splice(+b.dataset.rm,1);showAtt()}};
$("#pal").onclick=function(e){var b=e.target.closest("[data-rm]");if(b){pAtt.splice(+b.dataset.rm,1);showAtt()}};
function pick(inp,arr){var fs=Array.prototype.slice.call(inp.files);if(!assets||!fs.length)return;inp.disabled=true;
  Promise.all(fs.map(function(f){return assets.upload(f).then(function(r){arr.push({id:r.id,name:f.name||"ficheiro"})})})).catch(function(){dlg("Não foi possível enviar o ficheiro (máx. 20 MB; imagens ou PDF).")}).then(function(){inp.value="";inp.disabled=false;showAtt()})}
function addLink(inp,arr){var u=inp.value.trim();if(u.indexOf("https://")!==0&&u.indexOf("http://")!==0){dlg("Cole uma ligação que comece por https://");return}arr.push({id:"",url:u,name:u.split("//")[1].slice(0,40)});inp.value="";showAtt()}
$("#flb").onclick=function(){addLink($("#fll"),fAtt)};$("#plb").onclick=function(){addLink($("#pll"),pAtt)};
$("#faf").onchange=function(){pick(this,fAtt)};$("#paf").onchange=function(){pick(this,pAtt)};$("#fac").onchange=function(){pick(this,fAtt)};$("#pac").onchange=function(){pick(this,pAtt)};
function openPay(it){payIt=it;$("#pt").textContent="Pagar: "+it.name;$("#pm").value=it.method||"Multibanco";$("#pn").value="";pAtt=[];showAtt();$("#pv").classList.add("on")}
$("#pc").onclick=function(){$("#pv").classList.remove("on")};
$("#pv").onclick=function(e){if(e.target.id==="pv")$("#pv").classList.remove("on")};
$("#po").onclick=function(){var it=payIt;$("#pv").classList.remove("on");if(it)doPay(it,$("#pm").value,$("#pn").value.trim())};
function doPay(it,method,note){
  var d={lastPaid:fd(today()),paidBy:myId||null,method:method||""};
  if(hcol)hcol.add({payId:it.id,name:it.name,cat:it.cat||"Outros",who:it.who||"Geral",amount:it.amount||0,date:fd(today()),dueDate:it.due,by:myId||null,method:method||"",note:note||"",att:pAtt.slice()});
  if(it.freq==="once")d.done=true;else{var n=nxt(it.due,it.freq);while(days(n)<-3&&it.freq!=="once")n=nxt(n,it.freq);d.due=n}
  col.doc(it.id).update(d).catch(function(){dlg("Sem permissão para atualizar.")})
};
(async function(){
  var db=null;
  try{if(window.claude){db=await claude.use("db");userCap=await claude.use("user");try{assets=await claude.use("assets")}catch(x){}}}catch(e){}
  if(!db){$("#app").innerHTML='<div class="msg">Abra esta página através do link partilhado, com a sessão iniciada no Claude, para sincronizar os dados.</div>';return}
  try{myId=userCap?await userCap.id():null}catch(e){}
  col=db.collection("payments");hcol=db.collection("history");sdoc=db.doc("settings/family");sdoc.onSnapshot(function(s){var d=s.data();members=((d&&d.members)||[]).slice();render()},function(){});
  hcol.onSnapshot(function(s){hist=s.docs.map(function(d){var o=Object.assign({},d.data()||{});o.id=d.id;return o});if(view==="hist")render()},function(){});$("#add").style.display="block";$("#fatt").style.display="block";$("#patt").style.display="block";if(!assets)document.querySelectorAll(".fb").forEach(function(e){e.style.display="none"})
  var t=setTimeout(function(){if(!loaded)$("#app").insertAdjacentHTML("afterbegin",'<div class="msg">Sem ligação aos dados. A tentar…</div>')},10000);
  col.onSnapshot(function(s){loaded=true;clearTimeout(t);items=s.docs.map(function(d){var o=Object.assign({},d.data()||{});o.id=d.id;return o});render()},function(){clearTimeout(t);$("#app").innerHTML='<div class="msg">Erro ao ler os dados. Verifique a sua permissão de acesso.</div>'});
  render()
})();
</script></body></html>
